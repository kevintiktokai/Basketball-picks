# ============================================================================
# EUROPE — EuroLeague + EuroCup totals with real bookmaker timelines
# Pre-registered BEFORE any odds outcome was analysed. Before this file was written,
# only these odds requests had been made: response-format checks, a search for the
# start of the free archive (single games, Pinnacle-only, existence checked), and the
# full timeline of ONE game (Paris v ASVEL, 2026-10-07) used to build the parser. Its
# opening and closing lines were looked at; no result was compared with any line.
# ============================================================================

sources:
  odds: "OddsPapi free tier, v4 /historical-odds: full pre-game price timeline per book"
  books: [pinnacle, 1xbet, betway]       # Pinnacle = sharp reference + two soft books
  books_note: >
    Amended 2026-10-08, before any outcome was analysed: the free archive has almost no
    bet365 pre-game history before 2026-27 and patchy Unibet history in Jan-Feb 2026, while
    1xBet and Betway have the fullest 2025-26 archive (measured on one 2026-03-10 game:
    pre-game totals updates 1xbet 2,350, betway 548, unibet 422, betsson 457, bwin 338,
    williamhill 44, bet365 0). The first 44 games were fetched as [pinnacle, bet365, unibet]
    and are kept; one request per game, so no game is fetched twice.
  pre_game_cutoff: "scheduled start - 1 minute (in-game pricing starts on the same market ids)"
  results_and_features: "official EuroLeague API (data/euroleague.py), ratings with venue_tempo=True"
  tournaments: {euroleague: 138, eurocup: 141}

archive:
  measured_2026_10_08: "EuroLeague history absent on 2025-11-05, 2025-12-04, 2026-01-06, 2026-01-15;
    present on 2026-01-20, 2026-02-03, 2026-05-24, 2026-10-07. Pre-game coverage by book grows
    through the season: late January has Unibet only (Pinnacle in-game only); Pinnacle pre-game
    from late January/February; bet365 essentially only from 2026-27."
  start_used: "2026-01-20"
  note: "may be a rolling ~9-month window; games are fetched OLDEST FIRST so none expire unfetched"
  budget: "~200 requests/month on the free tier, one request per game"

splits:
  development: "2025-26 games fetched in October 2026: 2026-01-20 .. 2026-03-20, plus three
    sample games (2026-04-03, 2026-04-07, 2026-05-05) already analysed in Q1-Q4"
  holdout: "2025-26 games 2026-03-21 .. 2026-06-30 except the three samples; NOT yet fetched
    when the strategy is locked; evaluated ONCE when November's quota brings them in"
  test: "2026-27 season, all games; joined to results and evaluated ONCE, after the engine
    is locked in config/europe_locked.yaml (committed first)"
  forward: "games after the lock date also go to the live ledger"
  amended: "2026-10-08, before the optimisation was run: the holdout was carved out of the
    not-yet-fetched part of 2025-26 so the locked strategy gets an early out-of-sample check"

optimisation:                            # declared before the grid was run
  unit: "two-leg card, legs from different games of the same date (Europe/Madrid), combined
    odds >= 2.5; legs are real soft-book prices; EV and CLV against Pinnacle's no-vig ladder"
  grid:
    decision_time: [pinnacle_open, 24h, 12h, 6h, 3h, 1h, game_day_10am]
    leg_ev_min: [0.0, 0.01, 0.02, 0.03, 0.05]
    leg_odds_band: [[1.40, 1.90], [1.50, 1.75], [1.55, 1.70], [1.70, 2.10]]
    books: [all_soft, 1xbet, betway]
    model_agrees: [false, true]
    cards_per_date: [1, all_disjoint]
  objective: "mean joint CLV per card (primary); profit is too noisy at this sample size"
  selection: "best objective with >= 8 cards on all development data -> locked strategy"
  honest_estimate: "nested 2-fold time CV: select on the first half of the development dates,
    score on the second half, and vice versa (>= 4 cards in the selection fold)"

questions:                               # in this order; development data only until locked
  Q1_soft_vs_sharp_opener: >
    How far do bet365/Unibet opening totals sit from Pinnacle's no-vig line, and does the
    close move toward Pinnacle's opener (closing-line value of 'take the soft book when its
    opener is >= k points off Pinnacle's fair line')?
  Q2_value_vs_fair: >
    Legs offered at bet365/Unibet (main or ladder line) whose price beats Pinnacle's no-vig
    probability for the same line, at the opener and at fixed times before tip-off:
    frequency, size, and result.
  Q3_model: "Does the rating model add information to Pinnacle's opening line (log-loss gain)?"
  Q4_cards: >
    The stage-3 card rule (two legs, combined >= 2.5, legs 1.40-1.90) using REAL ladder
    prices from the three books, with Pinnacle-derived and model-derived probabilities.

metrics: [hit rate vs break-even, ROI at real prices with date-bootstrap 95% CI,
          CLV vs Pinnacle's close, longest losing run]

rules:
  - development may iterate on development data only; every configuration is logged
  - the engine is locked and committed before any 2026-27 result is compared with a line
  - with ~250 development games, outcome-based ROI is noisy; CLV (Q1/Q2) is the primary
    development signal
