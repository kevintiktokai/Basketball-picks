# ============================================================================
# STAGE 2b — SECOND INDEPENDENT TEST (pre-registered BEFORE any data download
# of the test odds and before any evaluation).
#
# The stage-2 engine was locked in config/stage2_locked.yaml (commit 16db918) and
# evaluated once on NCAAB 2018-19..2020-21 (60.9% 2/2, 363 cards). Stage 2b runs
# the SAME locked engine — no feature, parameter or policy changes — on five NEW
# seasons whose odds come from a different source (sportsbookreview.com, multiple
# US books, opening and closing totals with real prices).
# ============================================================================

test_seasons: ["2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]
odds_source:
  site: "https://www.sportsbookreview.com"
  endpoints: ["betting-odds/ncaa-basketball/totals/full-game", "betting-odds/ncaa-basketball (point spread)"]
  date_range_each_season: ["11-01", "04-10"]
  politeness: "<= 1 request per second"
definitions:
  open_line: "median of the opening totals of all books that posted one (primary)"
  close_line: "median of the latest (closing) totals"
  spread: "median opening home spread (sign: + = home favoured)"
  line_shopping_variant: "best available opening total for the chosen side (secondary, labelled)"
  neutral_site: "hoopR / ESPN schedule flag"
engine: "config/stage2_locked.yaml, unchanged; walk-forward refit each season on all prior seasons"
team_keys: "ESPN team ids (matched by date + final score), so archive and new seasons share identities"
report_primary: "two-pick buffered card 2/2 rate per season and pooled, 95% CI; EV scenarios as in stage 2"
report_secondary: "main-line two-sided picks at REAL opening prices (best book and median book)"
