league: NCAAB
market: open                    # bet at the opening full-game total
model:
  iteration: it10_open_style
  mean_feats: [x_pts, x_eff, early, log_games, abs_spread, neutral_i, line_rel, x_poss, vol_sum,
               mkt_bias_sum, open_bias_sum, move_hist_sum, rest_min, weekend, march, log_slate,
