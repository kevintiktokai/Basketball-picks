# Engine-improvement study 1 — pre-registered 2026-10-08, BEFORE any candidate was fitted or scored.
# Engine: the locked NCAAB v3 opener engine (config/stage3_v3_locked.yaml). The mean and variance
# models are unchanged; only the calibrator that turns (mu, sd, buffer) into P(win) is varied.
study: side_aware_calibration
status: pre-registered

motivation: >
  reports/bet_diagnostics.md: among bets with calibrated P >= 55%, Unders won more often than
  predicted in every era (+2.3, +7.8, +7.4 points in 2011-18, 2018-21, 2021-26) and Overs slightly
  less (-0.3, -1.3, -1.0). A mechanism check (exploration on 2011-21, where half scores exist):
  overtime happens in 6-7% of games and adds about 24 points when it does (+1.4 to +1.6 to the mean
  total), so totals are right-skewed. The mean residual against the opener is +0.7 to +0.85 points but
  the median is 0 to +0.5; Overs hit 50.0-50.8% while the normal model's average P(over) is 52.4-53.0%.
  The locked calibrator is symmetric (P(win) depends only on side*mu/sd and the buffer), so it cannot
  remove an Over/Under asymmetry.

data: >
  The cached walk-forward predictions of the locked v3 engine (data/processed cache, fingerprinted).
  Calibrators are refitted walk-forward exactly as locked: for season s, fitted on the out-of-sample
  predictions of earlier seasons only, with the same season weights (calib_decay 0.6) and pseudo-bets.

candidates:
  C0_locked: "locked calibrator: b0 + b1*s_model + b2*s_buf + b3*s_buf^2 + b4*s_model*s_buf"
  C1_side: "C0 + b5*side (Over +1, Under -1); one extra parameter"
  C2_side_buffer: "C1 + b6*side*s_buf + b7*side*s_buf^2; the alternate-line curve may differ by side (skewed tails)"

eras:   # all were used before, so this is a re-analysis; the 2026-27 forward ledger is the real test
  dev: ["2011-12", "2012-13", "2013-14", "2014-15", "2015-16", "2016-17", "2017-18"]
  holdout: ["2018-19", "2019-20", "2020-21"]
  reanalysis: ["2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]

metrics:
  primary: "log loss of the two-sided P(over) at the opening line, every calibrated eligible non-push game, per era"
  secondary:
    - "P >= 55% singles at the opener: bets, win rate, win minus predicted by side, ROI at -110 (all eras), ROI at the best book's real price (2021-26)"
    - "pseudo-bet log loss over the alternate-line buffers (pricing of card legs), per era"
    - "2.5+ target cards with real prices, 2021-26, locked stage-3 products (re-analysis)"

adoption_rule: >
  A candidate is adopted only if its primary log loss is lower than C0's in EACH of the three eras
  AND its pooled P >= 55% ROI at -110 (2011-26) is not lower than C0's. If both candidates qualify,
  C1 is chosen unless C2 has a lower primary log loss than C1 in each era (fewer parameters win ties).
  Adopted means: the live engine records the adopted calibrator's picks next to C0's in the 2026-27
  forward ledger, and the forward season decides which one is used after it.

not_candidates_now:
  books_at_open: "6+ books at the open did better in 2021-26 (57.8% vs 55.6%), but no earlier data has book counts; logged in the forward ledger instead"
  extreme_shrink: "P >= 62% looked overconfident in the later eras on only 55-70 bets; too few to act on"
  neutral_site: "neutral-site bets beat their predictions but are mostly Unders; re-checked after the side term, not tested separately"

# ---------------------------------------------------------------------------------------------
study_2:
  name: stage_and_matchup_features
  status: pre-registered 2026-10-08, before any candidate below was fitted
  motivation: >
    reports/ncaab_stage_map.md (2011-21 only; 2021-26 sealed): against the locked v3 engine's own
    forecast, conference-tournament totals came in 0.9 and 2.0 points lower (dev, holdout; t -2.0,
    -2.9) and NIT/CBI/CIT totals 2.9 and 1.6 points higher; the engine knows only "March", not the
    event. reports/improve_explore.md: fast-vs-slow tempo matchups and efficiency mismatches went
    under in every era. Tournament games are often on consecutive days (fatigue).
  engine: locked v3 (config/stage3_v3_locked.yaml); the mean model gets extra features; the variance
    model, calibrator, decays, eligibility and products are unchanged.
  stage_labels: data/ncaab_stages.py (ESPN schedule; known before tip-off)
  candidates:
    S1_stage: "+ indicators for nonconf_home, nonconf_neutral, conf_tournament, ncaa_tournament, other_postseason (conf_regular = baseline)"
    S2_stage_matchup: "S1 + tempo gap |tempo_home - tempo_away| + efficiency mismatch (pre-game ratings)"
    S3_stage_matchup_fatigue: "S2 + games each team played in the previous 3 days (ESPN schedule), summed"
  selection_seasons: "2011-12 .. 2020-21 (eras dev 2011-18 and holdout 2018-21)"
  selection_rule: >
    A candidate qualifies if, against the locked engine, it has (a) lower log loss of the two-sided
    P(over) at the opener in BOTH eras and (b) higher ROI at -110 at matched volume in BOTH eras
    (matched volume: in each season, each engine's N most confident games, N = the locked engine's
    number of P >= 55% bets that season). Among qualifiers, the highest pooled 2011-21 matched-volume
    ROI is selected. If none qualifies, the study stops and 2021-26 stays sealed.
  confirmation: >
    ONE run on the sealed 2021-22 .. 2025-26 seasons for the selected candidate only (the script
    refuses to run twice). It passes if its log loss is lower AND its matched-volume ROI is not lower
    at -110 and at the best book's real price. Pass = it is recorded next to the locked engine in the
    2026-27 forward ledger; the forward season decides any switch.
  disclosure: >
    The 2021-26 seasons were used before (stage-2b test, stage-3 re-analysis) and the bet diagnostics
    showed the locked engine's 2021-26 bets split by month and by neutral site; stage-by-stage
    results for 2021-26 have not been computed.

