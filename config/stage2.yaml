nba:
  development: ["2007-08", "2008-09", "2009-10", "2010-11", "2011-12", "2012-13", "2013-14",
                "2014-15", "2015-16", "2016-17", "2017-18", "2018-19", "2019-20", "2020-21"]
  # 2021-22..2025-26 were evaluated ONCE in aggregate by the stage-1 locked model.
  # Stage-2 NBA models are selected on development seasons only and then tested on
  # these seasons; results are labelled "post-development test (previously viewed)".
  post_dev_test: ["2021-22", "2022-23", "2023-24", "2024-25", "2025-26"]

cards:
  joint_target: 0.60
  conservative_quantile: 0.05
  # Card constructions explored in stage 2 (all evaluated on development seasons):
  #   main_line      : two picks at the market line, Over or Under, distinct games
  #   buffered_line  : two picks at alternate lines moved in the bettor's favour
  #                    (hit rate bought with price; EV reported under explicit pricing)
  #   same_game      : correlated legs from one game (reported separately; NOT counted
  #                    as two independent selections)

multiple_testing:
  rule: "report the number of configurations tried; the final holdout claim is about ONE locked configuration per market"

