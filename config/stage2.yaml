# ============================================================================
# STAGE 2 PROTOCOL — written and committed BEFORE any NCAAB model was fitted
# and before any stage-2 NBA model was evaluated.
#
# Stage 2 widens the search: Over AND Under, NCAA men's basketball, opening /
# closing / second-half markets, variance models, and alternative card
# constructions (incl. buffered "alternate" lines). Many configurations will
# be tried; every one is logged to reports/experiments/ and selection uses
# DEVELOPMENT seasons only. The NCAAB holdout is evaluated exactly once.
# ============================================================================

ncaab:
  periods:
    discovery:  ["2007-08", "2008-09", "2009-10", "2010-11", "2011-12", "2012-13", "2013-14", "2014-15"]
    validation: ["2015-16", "2016-17", "2017-18"]
    holdout:    ["2018-19", "2019-20", "2020-21"]   # pristine: never modelled before lock
  markets:
    open:  "bet the opening full-game total (features: prior games only)"
    close: "bet the closing full-game total (features: prior games + open->close move)"
    second_half: "bet the second-half total at half-time (features: prior games + this game's lines + 1st-half score)"
  assumed_decimal_odds: 1.909   # archive stores no total prices
